name: Code quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Biome
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Biome
        # clover: provider=auto constraint=minor tags=setup-biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          # cooldown matches bunfig.toml's minimumReleaseAge, so Clover cannot
          # propose a release that `bun install` will then refuse to resolve.
          # clover: provider=github id=biome repository=biomejs/biome source=releases tag-prefix=@biomejs/biome@ cooldown=72h constraint=minor tags=biome
          version: 2.5.5

      - name: Run Biome
        run: biome ci .
