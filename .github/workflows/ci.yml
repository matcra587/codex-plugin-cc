# See NOTICE for attribution and plugins/codex/CHANGELOG.md for changes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Bun
        # clover: provider=auto constraint=minor tags=setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Install Codex CLI
        # 6h cooldown, matching the minimumReleaseAgeExcludes entry in bunfig.toml.
        # clover: provider=github repository=openai/codex source=releases tag-prefix=rust-v cooldown=6h constraint=minor tags=codex
        run: bun add --global @openai/codex@0.146.0

      - name: Check manifest versions agree
        run: bun run check-version

      - name: Run test suite
        run: bun test

      - name: Generate protocol types and type-check
        run: bun run build
